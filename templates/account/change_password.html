{% extends "base.html" %}
{% block title %}Change Password — HairShellizer{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:560px;">
  <div class="mb-4">
    <div class="section-eyebrow">Security</div>
    <h2 class="mb-1">Change Password</h2>
    <p class="text-muted mb-0">Use a strong password you do not reuse elsewhere.</p>
  </div>
  <div class="card border-0 shadow-sm p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Update Password</button>
        <a href="{{ url_for('account.profile') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
