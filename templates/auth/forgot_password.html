{% extends "base.html" %}
{% block title %}Forgot Password — HairShellizer{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="text-center mb-4">
    <div class="section-eyebrow">Account Security</div>
    <h2 class="mb-2">Forgot Password?</h2>
    <p class="text-muted mb-0">Enter your account email and we'll send you a secure reset link.</p>
  </div>
  <div class="card border-0 shadow-sm p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-success w-100">Send Reset Link</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
  </div>
</div>
{% endblock %}
