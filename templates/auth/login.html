{% extends "base.html" %}
{% block title %}Login — HairShellizer{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <h2 class="mb-4 text-center">Login</h2>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-2"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
  <p class="text-center">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
