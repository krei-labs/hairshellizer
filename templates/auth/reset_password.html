{% extends "base.html" %}
{% block title %}Reset Password — HairShellizer{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="text-center mb-4">
    <div class="section-eyebrow">Account Security</div>
    <h2 class="mb-2">Set a New Password</h2>
    <p class="text-muted mb-0">Choose a new password for your HairShellizer account.</p>
  </div>
  <div class="card border-0 shadow-sm p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-success w-100">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
